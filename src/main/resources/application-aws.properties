# ============================================
# Archivo: application-aws.properties
# Resumen: Perfil de configuración de Spring Boot para despliegues en AWS RDS.
# Define la conexión a la base de datos remota MySQL y optimizaciones de pool Hikari.
# ============================================
# Perfil AWS RDS (MySQL)
# ============================================

# 1. URL de conexión a AWS RDS
# REEMPLAZA EL ENDPOINT ENTRE LOS CORCHETES
# 1. URL de conexión a AWS RDS (Añadido auto-recuperación y validación)
spring.datasource.url=jdbc:mysql://unimatchdb.c74qgu6sy5co.us-east-2.rds.amazonaws.com:3306/unimatchDB?createDatabaseIfNotExist=true&serverTimezone=UTC&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true

# 2. Credenciales de AWS RDS
spring.datasource.username=Tonagod
spring.datasource.password=UniMatch2026

# 3. Configuración técnica para MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 4. Hibernate Auto-Generación
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 5. Optimización HikariCP Ultra-Estable (Ajustado para AWS RDS Free Tier)
# Forzamos a Hikari a renovar conexiones más seguido (10 min)
spring.datasource.hikari.max-lifetime=580000
# Mantenemos viva la conexión enviando un "ping" cada 30 segundos
spring.datasource.hikari.keepalive-time=30000
# Tiempo máximo para esperar una conexión libre
spring.datasource.hikari.connection-timeout=30000
# Tiempo máximo que una conexión puede estar ociosa
spring.datasource.hikari.idle-timeout=280000
# Número de conexiones
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
# Validación estricta
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
# Detecta si hay fugas de conexiones (si una se queda abierta más de 30s sin usarse)
spring.datasource.hikari.leak-detection-threshold=30000

# Servir el frontend
spring.web.resources.static-locations=classpath:/static/
