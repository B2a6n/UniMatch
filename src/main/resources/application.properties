# ============================================
# UniMatch — Configuración Spring Boot
# ============================================

server.port=8080

# ============================================
# PERFIL ACTIVO: h2 (desarrollo local) u oracle (producción)
# Cambia a "oracle" cuando configures tu BD Oracle Cloud
# ============================================
spring.profiles.active=aws

# ============================================
# H2 Database (para desarrollo local sin Oracle)
# ============================================
spring.datasource.url=jdbc:h2:file:./data/unimatch;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ============================================
# Configuración de archivos estáticos (frontend)
# ============================================
spring.web.resources.static-locations=file:./,classpath:/static/

# ============================================
# Tamaño máximo de subida (imágenes)
# ============================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# Logging
# ============================================
logging.level.com.unimatch=DEBUG
