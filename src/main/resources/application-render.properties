# ============================================
# UniMatch — Configuración Spring Boot para Render
# ============================================
# En Render, la base de datos se pasa a través de una variable de entorno de Spring (DB_URL, DB_USERNAME, DB_PASSWORD)

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate para PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# En Render necesitamos que corra en el puerto que Render asigne, o por defecto 8080
server.port=${PORT:8080}
